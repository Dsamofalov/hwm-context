name: Repository Bootstrap CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate materialized read-model skeleton
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/CODEOWNERS
          grep -q 'derived/materialized read-model' README.md
          for d in bootstrap state tasks claims wiki graph health; do
            test -f "$d/.gitkeep"
            count="$(find "$d" -type f ! -name .gitkeep | wc -l)"
            test "$count" -eq 0
          done
