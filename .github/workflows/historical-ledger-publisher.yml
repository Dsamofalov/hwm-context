name: Historical Ledger Publisher

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event_name == 'issue_comment' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.preflight.outputs.should_run }}
      concurrency_key: ${{ steps.preflight.outputs.concurrency_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: preflight
        name: Parse trusted transport metadata only
        run: python -m publisher.historical_ledger_publisher_v2 preflight "$GITHUB_EVENT_PATH"

  publish:
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: hwm-context-${{ github.repository_id }}-${{ needs.preflight.outputs.concurrency_key }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Publish inert historical-ledger Git objects through scoped PR
        env:
          HWM_CONTEXT_PUBLISHER_TOKEN: ${{ github.token }}
        run: python -m publisher.historical_ledger_publisher_v2 publish "$GITHUB_EVENT_PATH"

  strict_gate:
    needs: [preflight, publish]
    if: ${{ needs.preflight.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Publish required bootstrap status only after exact trusted validation
        env:
          HWM_CONTEXT_STRICT_GATE_TOKEN: ${{ github.token }}
        run: python -m publisher.strict_check_publisher "$GITHUB_EVENT_PATH"

  cleanup:
    if: >-
      ${{ github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
          github.event.pull_request.merged == false && github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'publisher/historical-ledger/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Delete closed unmerged scoped sandbox branch
        env:
          HWM_CONTEXT_PUBLISHER_TOKEN: ${{ github.token }}
        run: python -m publisher.historical_ledger_publisher_v2 cleanup "$GITHUB_EVENT_PATH"
